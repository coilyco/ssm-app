name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: coilyco/.github/actions/setup-ci@b975f9dbb2a7c7dd7315f4b53dd3212c9b1e2685
        with:
          tools: just uv pre-commit trufflehog
          app_id: ${{ secrets.COILYCO_HOOKS_APP_ID }}
          private_key_base64: ${{ secrets.COILYCO_HOOKS_APP_PRIVATE_KEY_BASE64 }}

      - name: Run the pre-commit suite
        run: just ci

  gate:
    name: gate
    needs: [pre-commit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
